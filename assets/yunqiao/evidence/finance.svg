<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>把资源管理，交给专业分工。</title><desc>从治理材料中提取的经费协作机制。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1200" height="850" rx="3" fill="#eae2cf" stroke="#eae2cf"/><text x="56" y="65" font-size="19" fill="#687557" font-weight="400">云桥乡链 / 协作材料图版</text><text x="56" y="124" font-size="40" fill="#30432f" font-weight="400">把资源管理，交给专业分工。</text><text x="56" y="168" font-size="21" fill="#67725b" font-weight="400">从治理材料中提取的经费协作机制。</text><path d="M56 197L1144 197" fill="none" stroke="#8b9b79" stroke-width="2"/><rect x="56" y="229" width="520" height="132" rx="3" fill="#d9dfc9" stroke="#b9c0a6"/><text x="82" y="274" font-size="28" fill="#344333" font-weight="400">项目统筹</text><text x="82" y="316" font-size="22" fill="#344333" font-weight="400">明确资源边界，关注跨组安排。</text><rect x="610" y="229" width="534" height="132" rx="3" fill="#e0d8c4" stroke="#b9c0a6"/><text x="636" y="274" font-size="28" fill="#344333" font-weight="400">专业成员</text><text x="636" y="316" font-size="22" fill="#344333" font-weight="400">维护经费制度，承担相应审核与记录。</text><rect x="56" y="414" width="254" height="147" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="74" y="465" font-size="27" fill="#344333" font-weight="400">预算知情</text><text x="74" y="511" font-size="20" fill="#738063" font-weight="400">让使用边界可见</text><text x="313" y="495" font-size="23" fill="#8a774f" font-weight="400">→</text><rect x="334" y="414" width="254" height="147" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="352" y="465" font-size="27" fill="#344333" font-weight="400">保留凭证</text><text x="352" y="511" font-size="20" fill="#738063" font-weight="400">支出有据可查</text><text x="591" y="495" font-size="23" fill="#8a774f" font-weight="400">→</text><rect x="612" y="414" width="254" height="147" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="630" y="465" font-size="27" fill="#344333" font-weight="400">审核记录</text><text x="630" y="511" font-size="20" fill="#738063" font-weight="400">由对应角色把关</text><text x="869" y="495" font-size="23" fill="#8a774f" font-weight="400">→</text><rect x="890" y="414" width="254" height="147" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="908" y="465" font-size="27" fill="#344333" font-weight="400">台账与披露</text><text x="908" y="511" font-size="20" fill="#738063" font-weight="400">持续汇总并公开</text><rect x="56" y="612" width="1088" height="108" rx="3" fill="#344b39" stroke="#344b39"/><text x="83" y="656" font-size="28" fill="#f0e7d0" font-weight="400">专业授权与过程可见并行</text><text x="83" y="696" font-size="22" fill="#d4dfc5" font-weight="400">把财务工作交给相应成员，通过凭证、审核与台账保留可追踪性。</text><path d="M56 758L1144 758" fill="none" stroke="#8b9b79" stroke-width="2"/><text x="56" y="797" font-size="18" fill="#6c765e" font-weight="400">来源：经费报销与管理制度复核；制度由财务成员维护</text></g></svg>