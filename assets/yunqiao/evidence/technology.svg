<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>从业务语言，转成产品需求。</title><desc>报价平台功能清单中的地图需求节选。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1200" height="850" rx="3" fill="#eae2cf" stroke="#eae2cf"/><text x="56" y="65" font-size="19" fill="#687557" font-weight="400">云桥乡链 / 协作材料图版</text><text x="56" y="124" font-size="40" fill="#30432f" font-weight="400">从业务语言，转成产品需求。</text><text x="56" y="168" font-size="21" fill="#67725b" font-weight="400">报价平台功能清单中的地图需求节选。</text><path d="M56 197L1144 197" fill="none" stroke="#8b9b79" stroke-width="2"/><rect x="56" y="229" width="1088" height="56" rx="3" fill="#d7dfc6" stroke="#b9c0a6"/><text x="78" y="266" font-size="21" fill="#344333" font-weight="400">需求编号</text><text x="270" y="266" font-size="21" fill="#344333" font-weight="400">功能要求</text><text x="677" y="266" font-size="21" fill="#344333" font-weight="400">设计意图</text><text x="1056" y="266" font-size="21" fill="#344333" font-weight="400">优先级</text><rect x="56" y="286" width="1088" height="99" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="78" y="344" font-size="22" fill="#836d47" font-weight="400">MAP-001</text><text x="270" y="344" font-size="24" fill="#344333" font-weight="400">地理价格分布</text><text x="677" y="344" font-size="20" fill="#344333" font-weight="400">在地图上显示地区价格热度</text><text x="1080" y="344" font-size="23" fill="#344333" font-weight="400">P0</text><rect x="56" y="385" width="1088" height="99" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="78" y="443" font-size="22" fill="#836d47" font-weight="400">MAP-002</text><text x="270" y="443" font-size="24" fill="#344333" font-weight="400">区域价格对比</text><text x="677" y="443" font-size="20" fill="#344333" font-weight="400">不同产区销区价格对比</text><text x="1080" y="443" font-size="23" fill="#344333" font-weight="400">P1</text><rect x="56" y="484" width="1088" height="99" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="78" y="542" font-size="22" fill="#836d47" font-weight="400">MAP-003</text><text x="270" y="542" font-size="24" fill="#344333" font-weight="400">价格热力图层</text><text x="677" y="542" font-size="20" fill="#344333" font-weight="400">价格高低区域颜色区分</text><text x="1080" y="542" font-size="23" fill="#344333" font-weight="400">P2</text><text x="56" y="636" font-size="27" fill="#344333" font-weight="400">一线需求</text><text x="318" y="636" font-size="27" fill="#344333" font-weight="400">功能拆分</text><text x="582" y="636" font-size="27" fill="#344333" font-weight="400">优先级与口径</text><text x="939" y="636" font-size="27" fill="#344333" font-weight="400">界面表达</text><path d="M56 661L1139 661" fill="none" stroke="#8b9b79" stroke-width="2"/><text x="56" y="707" font-size="24" fill="#344333" font-weight="400">把经营者关心的问题，转成技术与设计成员能够讨论、承接的要求。</text><path d="M56 758L1144 758" fill="none" stroke="#8b9b79" stroke-width="2"/><text x="56" y="797" font-size="18" fill="#6c765e" font-weight="400">来源：本人《功能清单》MAP-001—003 · 产品需求设计</text></g></svg>