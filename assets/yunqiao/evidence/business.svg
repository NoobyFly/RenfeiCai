<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>把讨论的规则，写进共同约定。</title><desc>成员可提出异议；负责判断的人也需要听懂不同专业。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1200" height="850" rx="3" fill="#eae2cf" stroke="#eae2cf"/><text x="56" y="65" font-size="19" fill="#687557" font-weight="400">云桥乡链 / 协作材料图版</text><text x="56" y="124" font-size="40" fill="#30432f" font-weight="400">把讨论的规则，写进共同约定。</text><text x="56" y="168" font-size="21" fill="#67725b" font-weight="400">成员可提出异议；负责判断的人也需要听懂不同专业。</text><path d="M56 197L1144 197" fill="none" stroke="#8b9b79" stroke-width="2"/><text x="56" y="247" font-size="29" fill="#344333" font-weight="400">专业分工，也要共同理解。</text><rect x="56" y="281" width="1088" height="105" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="82" y="324" font-size="25" fill="#856a42" font-weight="400">允许异议</text><text x="268" y="321" font-size="24" fill="#344333" font-weight="400">“随时可以向负责人提出批评建议”</text><text x="268" y="360" font-size="20" fill="#748164" font-weight="400">以事实与理由参与讨论。</text><rect x="56" y="407" width="1088" height="105" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="82" y="450" font-size="25" fill="#856a42" font-weight="400">解释判断</text><text x="268" y="447" font-size="24" fill="#344333" font-weight="400">“对一些专业的定义和概念进行简单解释”</text><text x="268" y="486" font-size="20" fill="#748164" font-weight="400">让不同背景的成员理解依据。</text><rect x="56" y="533" width="1088" height="105" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="82" y="576" font-size="25" fill="#856a42" font-weight="400">准备表达</text><text x="268" y="573" font-size="24" fill="#344333" font-weight="400">“在文档中插入简单图表，务在清晰表达”</text><text x="268" y="612" font-size="20" fill="#748164" font-weight="400">复杂问题用问题文档与图表交流。</text><text x="56" y="696" font-size="26" fill="#344333" font-weight="400">提出问题   →   解释依据   →   讨论方案   →   形成工作安排</text><path d="M56 758L1144 758" fill="none" stroke="#8b9b79" stroke-width="2"/><text x="56" y="797" font-size="18" fill="#6c765e" font-weight="400">来源：《项目组合约》沟通与批评条款；由项目核心成员共同建设</text></g></svg>