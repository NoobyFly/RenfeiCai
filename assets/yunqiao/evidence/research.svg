<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>把一个宽问题，拆成可交付的研究。</title><desc>从实际工作包到任务字段，再到分层验收。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1200" height="850" rx="3" fill="#eae2cf" stroke="#eae2cf"/><text x="56" y="65" font-size="19" fill="#687557" font-weight="400">云桥乡链 / 协作材料图版</text><text x="56" y="124" font-size="40" fill="#30432f" font-weight="400">把一个宽问题，拆成可交付的研究。</text><text x="56" y="168" font-size="21" fill="#67725b" font-weight="400">从实际工作包到任务字段，再到分层验收。</text><path d="M56 197L1144 197" fill="none" stroke="#8b9b79" stroke-width="2"/><rect x="56" y="229" width="1088" height="75" rx="3" fill="#d7dfc6" stroke="#b9c0a6"/><text x="82" y="277" font-size="28" fill="#344333" font-weight="400">一级任务：市场分析与商业模式</text><path d="M183 304L183 339" fill="none" stroke="#8b9b79" stroke-width="2"/><rect x="56" y="339" width="254" height="107" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="74" y="381" font-size="24" fill="#344333" font-weight="400">国内外行业研究</text><text x="74" y="419" font-size="18" fill="#738063" font-weight="400">理解产业与市场背景</text><path d="M461 304L461 339" fill="none" stroke="#8b9b79" stroke-width="2"/><rect x="334" y="339" width="254" height="107" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="352" y="381" font-size="24" fill="#344333" font-weight="400">供应链管理</text><text x="352" y="419" font-size="18" fill="#738063" font-weight="400">梳理产销与流通关系</text><path d="M739 304L739 339" fill="none" stroke="#8b9b79" stroke-width="2"/><rect x="612" y="339" width="254" height="107" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="630" y="381" font-size="24" fill="#344333" font-weight="400">供应链金融</text><text x="630" y="419" font-size="18" fill="#738063" font-weight="400">探索配套金融服务</text><path d="M1017 304L1017 339" fill="none" stroke="#8b9b79" stroke-width="2"/><rect x="890" y="339" width="254" height="107" rx="3" fill="#f5efdf" stroke="#b9c0a6"/><text x="908" y="381" font-size="24" fill="#344333" font-weight="400">数字信息服务</text><text x="908" y="419" font-size="18" fill="#738063" font-weight="400">组织报价与市场信息</text><text x="56" y="495" font-size="25" fill="#344333" font-weight="400">每个任务都带上接手所需的信息</text><rect x="56" y="518" width="254" height="94" rx="3" fill="#f3eedf" stroke="#b9c0a6"/><text x="74" y="551" font-size="19" fill="#876d42" font-weight="400">目标</text><text x="74" y="588" font-size="19" fill="#344333" font-weight="400">任务描述、交付目标</text><rect x="334" y="518" width="254" height="94" rx="3" fill="#f3eedf" stroke="#b9c0a6"/><text x="352" y="551" font-size="19" fill="#876d42" font-weight="400">责任</text><text x="352" y="588" font-size="19" fill="#344333" font-weight="400">负责人、验收人</text><rect x="612" y="518" width="254" height="94" rx="3" fill="#f3eedf" stroke="#b9c0a6"/><text x="630" y="551" font-size="19" fill="#876d42" font-weight="400">安排</text><text x="630" y="588" font-size="19" fill="#344333" font-weight="400">优先级、起止时间</text><rect x="890" y="518" width="254" height="94" rx="3" fill="#f3eedf" stroke="#b9c0a6"/><text x="908" y="551" font-size="19" fill="#876d42" font-weight="400">关联</text><text x="908" y="588" font-size="19" fill="#344333" font-weight="400">父子任务、成果文档</text><rect x="56" y="650" width="1088" height="72" rx="3" fill="#344b39" stroke="#344b39"/><path d="M600 664V708" stroke="#82957a" stroke-width="1"/><g font-size="23" fill="#f0e7d0" font-weight="400"><text x="94" y="695">成员成果</text><text x="276" y="695" text-anchor="middle">→</text><text x="350" y="695">组长验收</text><text x="638" y="695">小组成果</text><text x="820" y="695" text-anchor="middle">→</text><text x="894" y="695">项目负责人验收</text></g><path d="M56 758L1144 758" fill="none" stroke="#8b9b79" stroke-width="2"/><text x="56" y="797" font-size="18" fill="#6c765e" font-weight="400">来源：市场分析与商业模式任务记录；本人《任务表格使用手册》</text></g></svg>